name = "trainboard-alerts"
main = "worker.js"
compatibility_date = "2026-11-21"
workers_dev = true

# Server-side polling every two minutes.
[triggers]
crons = ["*/2 * * * *"]

[[d1_databases]]
binding = "TRAINBOARD_STATE"
database_name = "trainboard-alerts-state"
database_id = "a53ea7da-81a8-47bf-8039-a00baa0d412e"
