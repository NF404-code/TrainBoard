name: Deploy TrainBoard Worker

on:
  push:
    branches: [main]
    paths:
      - worker.js
      - wrangler.toml
      - tests/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trainboard-cloudflare-production
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TrainBoard
        uses: actions/checkout@v4

      - name: Validate Worker syntax
        run: node --check worker.js

      - name: Run Worker tests
        run: node --test tests/*.test.js

      - name: Check Cloudflare deployment authorization
        id: authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare deployment skipped: add the CLOUDFLARE_API_TOKEN Actions secret."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy trainboard-alerts
        if: steps.authorization.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2a6cdd610dcf07e6576472058c1cbdb5
          command: deploy

      - name: Explain skipped deployment
        if: steps.authorization.outputs.ready != 'true'
        run: echo "Worker was tested but not deployed. Add CLOUDFLARE_API_TOKEN and run this workflow again."
