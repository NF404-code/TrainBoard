name: Validate TrainBoard Pages preview
on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "push/**"
      - ".github/workflows/validate-preview.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "push/**"
      - ".github/workflows/validate-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check deploy/public/app.js
          node --check deploy/public/sw.js
          node --input-type=module --check < deploy/functions/api/schedule.js
      - name: Verify static output and routing
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          public=Path('deploy/public')
          required=['index.html','app.js','app.css','manifest.webmanifest','sw.js','icon.svg','_routes.json','_headers']
          missing=[x for x in required if not (public/x).is_file()]
          assert not missing, f'Missing: {missing}'
          manifest=json.loads((public/'manifest.webmanifest').read_text())
          assert manifest['start_url']=='/' and manifest['display']=='standalone'
          routes=json.loads((public/'_routes.json').read_text())
          assert routes['include']==['/api/*']
          assert Path('deploy/functions/api/schedule.js').is_file()
          assert 'id="cards"' in (public/'index.html').read_text()
          print('Static files and Functions route ready')
          PY
      - name: Test read-only Cloudflare proxy
        run: node deploy/tests/proxy.test.mjs

      - name: Check Web Push and proxy syntax
        run: |
          node --check push/worker.js
          node --check 'deploy/functions/api/push/[[path]].js'
      - name: Test Web Push train normalization and change detection
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {normalizeTrain,changesBetween} from './push/worker.js';
          const train=normalizeTrain({slotId:'early',number:123,targetArrival:'06:30',delayMinutes:0});
          assert.equal(train.number,'123');
          assert.equal(train.time,'06:30');
          const baseline={day:'2026-11-24',trains:[train]};
          assert.deepEqual(changesBetween(baseline,baseline),[]);
          assert.equal(changesBetween(baseline,{...baseline,trains:[{...train,delay:5}]}).length,1);
          assert.deepEqual(changesBetween(baseline,{...baseline,day:'2026-11-25'}),[]);
          JS
